<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Sun Element -->
  <circle cx="340" cy="180" r="64" fill="url(#sunGrad)" opacity="0.95" />

  <!-- Cloud Base -->
  <path d="M160 360 h220 a70 70 0 0 0 0 -140 a90 90 0 0 0 -170 -30 a60 60 0 0 0 -50 170 z" fill="url(#cloudGrad)" />

  <!-- Sprout / Agriculture Accent -->
  <g transform="translate(256, 360) scale(1.3)">
    <path d="M-8 0 Q-18 -28 -38 -32 Q-22 -8 -8 0 Z" fill="#22c55e" />
    <path d="M8 0 Q18 -32 40 -36 Q24 -10 8 0 Z" fill="#16a34a" />
    <circle cx="0" cy="0" r="4" fill="#15803d" />
  </g>

  <!-- Telemetry Radar rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="14 18" opacity="0.25" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.3" />
</svg>