name: Production Deployment Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Build & Deploy Application
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Production Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy Status Notification
        run: |
          echo "GaganDrishti production build compiled successfully and verified."
